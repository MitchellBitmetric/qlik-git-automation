name: Qlik Release PR (Reusable)

# Herbruikbare workflow: draait op elke push naar dev in de consumer-repo.
# Maakt (of werkt bij) de dev -> main PR met een automatisch berekende titel
# ("Release vX.Y.Z") en changelog-omschrijving. Maakt GEEN tag/release — dat
# gebeurt pas bij de merge naar main via release.yml.

on:
  workflow_call:
    inputs:
      automation_repo:
        description: "owner/repo waar qlik-git-automation staat (voor cross-org gebruik)"
        type: string
        required: false
        default: bitmetric-bv/qlik-git-automation
      main_branch:
        description: "doelbranch van de release-PR"
        type: string
        required: false
        default: main
      dev_branch:
        description: "bronbranch van de release-PR"
        type: string
        required: false
        default: dev

permissions:
  contents: read
  pull-requests: write

jobs:
  release-pr:
    runs-on: ubuntu-latest
    name: Release PR (dev -> main)
    steps:
      - name: Checkout consumer repo (dev)
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.dev_branch }}
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install pyyaml

      - name: Checkout automation repo (scripts)
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.automation_repo }}
          ref: main
          path: automation

      - name: Compute release PR text
        id: pr
        run: python automation/scripts/qlik_release_pr.py

      - name: Create or update dev -> main PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TITLE: ${{ steps.pr.outputs.title }}
          BODY: ${{ steps.pr.outputs.body }}
          BASE: ${{ inputs.main_branch }}
          HEAD: ${{ inputs.dev_branch }}
        run: |
          existing=$(gh pr list --base "$BASE" --head "$HEAD" --state open --json number --jq '.[0].number')
          if [ -n "$existing" ]; then
            gh pr edit "$existing" --title "$TITLE" --body "$BODY"
            echo "PR #$existing bijgewerkt."
          else
            gh pr create --base "$BASE" --head "$HEAD" --title "$TITLE" --body "$BODY"
            echo "Nieuwe dev -> main PR aangemaakt."
          fi

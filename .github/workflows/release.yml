name: Qlik Release (Reusable)

# Herbruikbare workflow: draait op merge dev -> main in de consumer-repo.
# Bepaalt versie, bouwt changelog/release-notes, injecteert het Qlik-blok,
# commit terug naar main en maakt tag + release.

on:
  workflow_call:
    inputs:
      automation_repo:
        description: "owner/repo waar qlik-git-automation staat (voor cross-org gebruik)"
        type: string
        required: false
        default: bitmetric-bv/qlik-git-automation
    secrets:
      GEMINI_API_KEY:
        required: false

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    name: Qlik Release
    steps:
      - name: Checkout consumer repo (main)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests pyyaml google-genai

      - name: Checkout automation repo (scripts)
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.automation_repo }}
          ref: main
          path: automation

      - name: Run release script
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python automation/scripts/qlik_release.py

name: Qlik Changelog Preview (Reusable)

# Herbruikbare workflow: draait op een PR naar de dev-branch (feature -> dev).
# Toont deterministisch wat de changelog + het Qlik-blok worden, en commit dat
# terug naar de PR-branch. Maakt GEEN tag/release — dat gebeurt bij dev -> main.

on:
  workflow_call: {}

permissions:
  contents: write
  pull-requests: write

jobs:
  preview:
    runs-on: ubuntu-latest
    name: Changelog Preview
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install pyyaml

      - name: Checkout automation repo (scripts)
        uses: actions/checkout@v4
        with:
          repository: bitmetric-bv/qlik-git-automation
          ref: main
          path: automation

      - name: Run changelog preview
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python automation/scripts/qlik_preview.py

      - name: Push preview commit
        run: git push origin HEAD:${{ github.head_ref }}
